# ============================================================================
#  美股低位高流动性股票观察工具 —— 主配置文件
#  所有门槛、权重、数据源都在这里调整，不要改代码。
#  语法：INI（# 或 ; 开头为注释）。列表用英文逗号分隔。布尔值：true / false
#  环境变量可用 ${VAR} 或 ${VAR:-默认值} 形式引用。
# ============================================================================

[general]
# 项目根目录：留空表示"config/config.ini 的上两级目录"
project_root =
# 数据库 / 数据 / 报告目录（相对 project_root，或写绝对路径）
database = data/market.db
output_dir = reports
report_language = zh

# 市场时区：行情数据与交易日历一律使用美国东部时间，不要写成 UTC 偏移量
market_timezone = America/New_York
# 报告里展示"下次运行时间"时使用的生活时区（新加坡用户可写 Asia/Singapore）
display_timezone = Asia/Shanghai

# 基准标的（用于相对强弱、市场环境判断）
benchmark = SPY

# 关机/睡眠错过定时任务后，下次运行时最多补跑多少个交易日
# （补跑只在程序真的被运行的时候发生，见 README「什么时候跑」一节）
catch_up_max_days = 10
# 行业基准映射文件（CSV: symbol,sector_etf）。留空则不做行业对比
sector_map_file =


# ---------------------------------------------------------------------------
# 股票池：第一版只扫描美国主流交易所的普通股
# ---------------------------------------------------------------------------
[universe]
# 允许的交易所（大小写不敏感）。NYSE / NASDAQ / NYSE_AMERICAN / ARCA ...
exchanges = NYSE, NASDAQ, NYSE_AMERICAN
# 允许的证券类型：common_stock（普通股）。可选加入 adr
security_types = common_stock
# 是否纳入 ADR（默认否，作为可配置选项）
include_adr = false
# 是否排除 OTC / 粉单
exclude_otc = true
# 硬门槛：股价、市值、流动性
min_price = 5.0
min_market_cap = 1000000000
min_avg_dollar_volume_20d = 10000000
# 可选：只扫描指定清单文件里的代码（CSV，每行一个 ticker，可带表头），
# 用于"阶段 1：先跑 100-300 只"的原型验证。留空 = 使用完整股票池
watchlist_file =
# 股票池上限（0 = 不限制）。按 20 日均额从大到小截断，用于控制 API 额度
max_symbols = 0
# 抓行情之前，先按市值取前 N 只（0 = 不限制）。
# 真实数据源下这个很关键：全美有 7000 只股票，逐只拉日线要几个小时。
# 200 只大约 1-2 分钟，覆盖"较成熟、流动性好"的那一段（对应构想里的阶段 1）。
prefilter_top_market_cap = 200
# 数据源没有市值字段时怎么办：
#   flag    = 放行但打上"市值未覆盖"标签（默认，避免因缺数据而漏掉整个市场）
#   exclude = 直接排除（更保守，但要求你先补齐市值数据）
missing_market_cap_policy = flag
# 可选：用外部 CSV 补充市值（列：ticker,market_cap）。Alpaca / Alpha Vantage
# 的资产接口都不含市值，这个文件可以把任何来源的市值补进来。
market_cap_file =
# 排除名称含这些关键词的证券（杠杆/反向/权证等常见命名）
exclude_name_keywords = Warrant, Right, Unit, Preferred, Depositary, Deposit, Notes, ETF, Fund, Acquisition


# ---------------------------------------------------------------------------
# 阶段 A/B/C 的筛选阈值
# ---------------------------------------------------------------------------
[filters]
# 低位观察区间：使用"交易日"，252 ≈ 1 个交易年
lookback_days = 252
# 距 52 周低点：当前价高于一年低点不超过该百分比
near_low_pct = 15.0
# 相对 52 周高点：回撤至少达到该百分比
min_drawdown_from_high_pct = 20.0
# 计算 20 日均额所需的最少有效交易日数
min_dollar_volume_days = 20
# 行情陈旧度：最新 K 线距目标交易日超过 N 个自然日则判为数据缺失
max_stale_days = 7
# 企稳判定的最低分（0-25 分制）。低于此分进入"低位但尚未企稳"组
min_stabilization_score = 12.0

# ---------------------------------------------------------------------------
# 买入偏好：买跌还是买涨（这是最关键的开关，直接影响主名单是谁）
#
#   dip        主名单 = 还在低位、且**还没涨起来**的股票（符合"买跌不买涨"）
#   stabilized 主名单 = 已经出现企稳/止跌信号的股票
#              —— 注意：止跌信号本身就意味着它已经在涨了（站上均线、RSI 回到 50+）
#   both       两组都列，但主名单仍然按 stabilized 排
#
# "已经涨起来"的三种判定，命中任意一条就降级（或按 rebound_action 直接排除）：
# ---------------------------------------------------------------------------
dip_preference = dip

# 近 1 个月涨幅上限（%）：超过就说明这一波已经涨了，不再是"跌"的对象
max_gain_1m_pct = 10.0
# 近 3 个月涨幅上限（%）
max_gain_3m_pct = 20.0
# RSI(14) 上限：高于这个值说明反弹已经走了一段
max_rsi_for_dip = 60.0
# true = 主名单必须仍在 50 日均线下方（最纯粹的"买跌"，但会过滤掉大部分企稳股）
require_below_ma50 = false
# 命中上面任一条件时怎么处理：
#   exclude  直接不进 A/B 名单，只在「已排除」里写明原因（默认，最贴近"我不想看到涨的"）
#   demote   进 C 组「已反弹」，作为参考单独列在报告最后
#   off      不过滤，只在风险标签里提示（按构想默认策略跑时用这个）
rebound_action = exclude
# 严重风险是否直接降级：持续创新低 / 异常波动 / 财报临近
demote_on_persistent_new_low = true
demote_on_extreme_volatility = true
# 财报临近的天数窗口（自然日）
earnings_alert_days = 3
# 异常波动判定：5 日已实现波动率 > 该倍数 × 60 日已实现波动率
volatility_spike_ratio = 2.5
# 单日收盘涨跌幅绝对值超过该百分比 -> 异常波动标签
single_day_move_pct = 15.0
# 市场环境：基准收盘价低于其 200 日均线时，给候选股加"市场环境风险较高"标签
market_regime_ma = 200


# ---------------------------------------------------------------------------
# 评分：100 分制，用于排序，不代表上涨概率
#   流动性 25 + 低位程度 30 + 企稳证据 25 + 公司质量 20
# ---------------------------------------------------------------------------
[scoring]
weight_liquidity = 25
weight_low_position = 30
weight_stabilization = 25
weight_quality = 20

# 流动性分项（合计 = weight_liquidity）
liquidity_volume_share = 20      # 20 日均额相对门槛的对数刻度
liquidity_stability_share = 5    # 成交额稳定性（变异系数越低越好）
liquidity_volume_saturation_x = 10.0   # 达到门槛的 10 倍即拿满

# 低位程度分项（合计 = weight_low_position）
low_near_low_share = 13          # 距 52 周低点越近越好
low_drawdown_share = 12         # 距 52 周高点回撤越深越好（有上限，防"自由落体"）
low_decline_share = 5           # 6 个月跌幅提供的"低位"加分（过深反而扣分）
low_drawdown_saturation_pct = 60.0   # 回撤 >= 60% 即拿满回撤分

# 企稳证据分项（合计 = weight_stabilization）
stab_rsi_share = 8              # RSI 从低位回升
stab_higher_low_share = 6       # 短期低点抬高 / 不再连续创新低
stab_ma_share = 7               # 站上 20 日 / 50 日均线
stab_volume_share = 4           # 上涨日成交额相对下跌日改善

# 公司质量：第一版若没有可靠基本面数据，请不要补满分或平均分，
# 而是把该维度标记为"基本面覆盖不足"，总分按 80 分制展示并降低置信度。
quality_enabled = false
quality_source = none           # none | sec_edgar | csv  (csv: data/fundamentals.csv)


# ---------------------------------------------------------------------------
# 数据源
#   provider = sample       离线合成数据（无需联网，用于跑通流程与演示）
#            = csv          读取本地 CSV 目录（任何供应商导出的数据）
#            = alpaca       Alpaca Market Data v2（需要 API key）
#            = alphavantage Alpha Vantage TIME_SERIES_DAILY_ADJUSTED（需要 API key）
# ---------------------------------------------------------------------------
[data_source]
# 默认用真实数据：Nasdaq 公开接口，免费、不需要注册或 API key。
# 想看离线合成数据（仅用于验证工具）：
#   python3 -m us_low_scan.cli demo             # 或
#   python3 -m us_low_scan.cli --provider sample scan
provider = nasdaq
# sample provider：合成市场规模与随机种子（可复现）
sample_symbols = 160
sample_days = 420
sample_seed = 20261010

# csv provider：目录结构 <csv_dir>/<SYMBOL>.csv，列名 date,open,high,low,close,volume
csv_dir =
csv_date_column = date

# alpaca provider：需环境变量 ALPACA_API_KEY / ALPACA_SECRET_KEY
alpaca_feed = iex               # iex | sip（sip 需要付费订阅）
alpaca_adjustment = split       # raw | split | all
# alphavantage provider：需环境变量 ALPHAVANTAGE_API_KEY
alphavantage_outputsize = full  # compact(100) | full(20年)
# 请求限速（每秒请求数）与失败重试
requests_per_second = 3.0
max_retries = 3
request_timeout = 30

# SEC EDGAR（风险检查：申报与财报日期），无需 API key，但必须填写可联系的 User-Agent
sec_user_agent = ${SEC_USER_AGENT:-us-low-scan research tool (contact: you@example.com)}
sec_enabled = false


# ---------------------------------------------------------------------------
# 每日输出
# ---------------------------------------------------------------------------
[output]
max_main_candidates = 5         # 主要关注：低位企稳组（0-5）
max_watch_candidates = 5        # 次级观察：低位但尚未企稳组（0-5）
write_markdown = true
write_csv = true
write_json = true
top_reasons = 4                 # 每只股票最多列出的入选理由条数
# 是否在每次扫描后导出一个可以直接双击打开的静态网站（reports/site/index.html）
write_html = true
# 静态站点输出目录（相对项目根目录，或写绝对路径）
html_dir = reports/site
# 是否把"通过阶段 A 且有足够历史"的全部股票特征写入 daily_features。
# 网页仪表板的「参数实验台」依赖这些特征来重算名单（不需要重新抓行情），
# 关掉可以省磁盘，但实验台就只能对当天已入选的股票做微调。
save_all_features = true


# ---------------------------------------------------------------------------
# 通知（阶段 4）
#   跑完 scan 后把名单发出去。支持邮件、Webhook（Slack / 企业微信 / 钉钉 /
#   Telegram / 通用 JSON）、macOS 本地通知。
#   密钥一律走环境变量，不要写在这个文件里。
# ---------------------------------------------------------------------------
[notify]
enabled = false
# 渠道：email / webhook / macos，逗号分隔
channels = email
# 主要候选少于该数量时不发通知（0 = 每天都发，即使当天没有候选）
min_main_candidates = 1
# 是否把完整报告的关键段落也放进正文（否则只发摘要）
include_reasons = false

# -- 邮件（SMTP）------------------------------------------------------------
smtp_host = ${SMTP_HOST:-}
smtp_port = ${SMTP_PORT:-587}
smtp_use_tls = true
smtp_username = ${SMTP_USERNAME:-}
smtp_password = ${SMTP_PASSWORD:-}
mail_from = ${SMTP_USERNAME:-}
# 收件人，多个用逗号分隔
mail_to =

# -- Webhook ----------------------------------------------------------------
# kind 决定 JSON 载荷格式：
#   generic  {"title": ..., "text": ...}
#   slack    {"text": ...}
#   wecom    企业微信机器人 {"msgtype":"text","text":{"content":...}}
#   dingtalk 钉钉机器人  {"msgtype":"text","text":{"content":...}}
#   telegram https://api.telegram.org/bot<token>/sendMessage + chat_id
webhook_url = ${WEBHOOK_URL:-}
webhook_kind = generic
telegram_chat_id = ${TELEGRAM_CHAT_ID:-}

# -- macOS 本地通知 ---------------------------------------------------------
macos_notify = false


# ---------------------------------------------------------------------------
# 参数方案（阶段 4）：不改数据、只改门槛与权重，一键切换风格
#   用法：python3 -m us_low_scan.cli scan --preset conservative
#         python3 -m us_low_scan.cli demo --preset aggressive
#   也可以在网页仪表板的「参数实验台」里临时试算，再决定要不要写进预设。
# ---------------------------------------------------------------------------
[presets]
# 不填则使用 [filters]/[scoring] 里的默认值
default =
# 已定义的方案，供 CLI 提示与网页下拉框使用
available = conservative, aggressive

# 更严格：只保留最贴近低点、且企稳证据明确的少数标的
[preset.conservative]
near_low_pct = 10
min_drawdown_from_high_pct = 25
min_avg_dollar_volume_20d = 25000000
min_stabilization_score = 16
weight_liquidity = 20
weight_low_position = 30
weight_stabilization = 30
weight_quality = 20
max_main_candidates = 3
max_watch_candidates = 3

# 更宽松：放宽回撤与企稳门槛，先把观察面铺开再人工筛
[preset.aggressive]
near_low_pct = 25
min_drawdown_from_high_pct = 15
min_avg_dollar_volume_20d = 5000000
min_stabilization_score = 8
weight_liquidity = 20
weight_low_position = 35
weight_stabilization = 25
weight_quality = 20
max_main_candidates = 8
max_watch_candidates = 8
